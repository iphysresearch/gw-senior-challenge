name: Deploy to GitHub Pages

# 任何推送到 main 都会自动构建并发布这个纯静态站点到 GitHub Pages。
# 站点是纯前端（HTML/CSS/JS + data/），无需构建步骤，直接上传整个仓库根目录。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # 整个仓库根即站点（含 index.html 与 data/）

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
